# ===================================================================
# HoneyChain - Development Profile (H2 Local File DB)
# ===================================================================

spring.datasource.url=jdbc:h2:file:./data/honeychain;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Demo Business Data enabled for development
app.demo-data.enabled=true

# Mock Blockchain and IoT
blockchain.mode=mock
iot.mock.enabled=true
iot.mock.interval-ms=60000

# File Upload
app.upload.base-dir=uploads
app.frontend.public-url=http://localhost:5173

# CORS
cors.allowed-origins=http://localhost:5173

# Security
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
