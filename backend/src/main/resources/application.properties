# ===================================================================
# HoneyChain - Application Configuration
# ===================================================================

spring.application.name=honeychain-backend
server.port=8080

# ===================================================================
# Database
# ===================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/honeychain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Sowmya@2006
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ===================================================================
# JPA & Hibernate
# ===================================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT
# ===================================================================

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS
# ===================================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================================================================
# File Upload
# ===================================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.base-dir=${UPLOAD_DIRECTORY:uploads}

# ===================================================================
# Public Frontend URL
# Used for QR-code verification links
# ===================================================================

app.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:5173}

# ===================================================================
# Blockchain
# ===================================================================

# mock = development/demo
# real = real blockchain implementation
blockchain.mode=${BLOCKCHAIN_MODE:mock}

# ===================================================================
# IoT Hive Health Monitoring
# ===================================================================

iot.mock.enabled=${IOT_MOCK_ENABLED:true}
iot.mock.interval-ms=${IOT_MOCK_INTERVAL_MS:60000}

# Temperature thresholds
iot.health.temperature.watch-threshold=37.0
iot.health.temperature.alert-threshold=39.0
iot.health.temperature.lower-watch-threshold=30.0
iot.health.temperature.lower-alert-threshold=28.0

# Humidity thresholds
iot.health.humidity.watch-threshold=70.0
iot.health.humidity.alert-threshold=80.0
iot.health.humidity.lower-watch-threshold=45.0
iot.health.humidity.lower-alert-threshold=35.0

# Activity thresholds
iot.health.activity.healthy-min=70
iot.health.activity.watch-min=40

# ===================================================================
# Anti-Counterfeit Verification
# ===================================================================

verification.risk.watch-threshold=20
verification.risk.high-risk-threshold=50
verification.debounce-seconds=5

verification.fingerprint-salt=${VERIFICATION_FINGERPRINT_SALT:honeychain-secure-salt-2026}

# ===================================================================
# Demo Business Data
# ===================================================================

# false = real user data
# true  = demo/test seed data
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# ===================================================================
# AI Yield Prediction
# Rule-based demo heuristics — not a real ML model
# ===================================================================

ai.yield-prediction.max-age-hours=${AI_PREDICTION_MAX_AGE:24}

ai.yield-prediction.default-min-kg=5.00
ai.yield-prediction.default-max-kg=8.00

ai.yield-prediction.healthy-adjustment=1.10
ai.yield-prediction.watch-adjustment=0.95
ai.yield-prediction.alert-adjustment=0.75

ai.yield-prediction.healthy-days=15
ai.yield-prediction.watch-days=18
ai.yield-prediction.alert-days=22

# ===================================================================
# SMS Notification
# ===================================================================

notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}

# ===================================================================
# SpringDoc / Swagger
# ===================================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# JSON / Date Formatting
# ===================================================================

spring.jackson.date-format=yyyy-MM-dd HH\:mm\:ss
spring.jackson.time-zone=UTC

# ===================================================================
# Logging
# ===================================================================

logging.level.root=INFO
logging.level.com.honeychain=DEBUG
logging.level.org.springframework.security=INFO

# OTP logging - development only
logging.level.com.honeychain.auth=DEBUG
