# Test Configuration Properties
spring.application.name=honeychain-backend-test

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:honeychain_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.demo-data.enabled=true
app.upload.base-dir=target/uploads
blockchain.mode=mock
iot.mock.enabled=false
notification.sms.enabled=false
