# ============================================================
# HoneyChain Frontend — Nginx Configuration
# SPA routing + static asset serving
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/x-font-ttf font/woff font/woff2
               image/svg+xml;

    # Static asset caching (JS/CSS/fonts with content hashes — safe to cache long)
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — forward /api/* to the backend container
    # This is used when frontend and backend are served via the same Nginx reverse proxy.
    # In a direct Docker Compose setup without a proxy, this block is not needed
    # because VITE_API_BASE_URL points the browser directly to the backend.
    # Uncomment and adjust if you run a unified reverse proxy:
    #
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA fallback — all routes return index.html so React Router can handle them.
    # This makes direct navigation to:
    #   /verify/:batchId
    #   /beekeeper/dashboard
    #   /customer/dashboard
    #   /admin/dashboard
    # work correctly without a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
